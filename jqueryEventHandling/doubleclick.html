<!DOCTYPE html>
<html>
<head>
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
    <script>
        $(document).ready(function(){
            $("p").dblclick(function(){
                // this function is used to activate when we double click this element
                $(this).hide();
            });
        });
    </script>
</head>
<body>

<p>If you double-click on me, I will disappear.</p>
<p>try me</p>
<p>try me too</p>

</body>
</html>
