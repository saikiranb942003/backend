-> eg to validate the input value

-->



<!DOCTYPE html>
<html>
<body>

    <h2>JavaScript input Validation</h2>

    <p>Enter a number</p>

    <input id="id1" type="number" min="100" max="300" required>
    <button onclick="myFunction()">OK</button>

    <p>If the number is less than 100 or greater than 300, an error message will be displayed.</p>
    <p id="demo"></p>

    <script>
        function myFunction() {
            const inputObject = document.getElementById("id1");
            if (!inputObject.checkValidity()) {
                // checkValidity()	Returns true if an input element contains valid data
                document.getElementById("demo").innerHTML = inputObject.validationMessage;
                // validationMessage : Contains the message a browser will display when the validity is false.
            } else {
                document.getElementById("demo").innerHTML = "OK";
            } 
        } 
    </script>

</body>
</html>
