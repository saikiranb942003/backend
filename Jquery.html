<!DOCTYPE html>
<html>
<head>
<script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
</head>
<body>

<h2>Finding HTML Elements by Id</h2>
<p id="id01">Hello World!</p>
<p id="id02">Hello Sweden!</p>
<p id="id03">Hello Japan!</p>
<p class="intro">Hello World!</p>

<p id="demo"></p>
<p id="demo1"></p>
<script>
  //Finding HTML Elements by Id
  $(document).ready(function() {
    var myElements = $("#id01");
    $("#demo").text("The text from the id01 paragraph is: " + myElements[0].innerHTML);
  });

  //Finding HTML Elements by Query Selector
  $(document).ready(function() {
    var myElements1 = $("p.intro");
    $("#demo1").text("The first paragraph with class='intro' is: " + myElements1[0].innerHTML);
  });
</script>

</body>
</html>
